<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Laporan & Bantuan - WhatsApp AutoBot AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/layout.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Container -->
  <div id="app-sidebar"></div>

  <!-- Main Wrapper -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Topbar Panel Container -->
    <div id="app-topbar"></div>

    <main class="flex-1 p-6 md:p-10 space-y-6 overflow-y-auto">
      <div>
        <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
          <i data-lucide="life-buoy" class="w-5 h-5 text-indigo-400"></i> Layanan Bantuan & Laporan Kendala
        </h2>
        <p class="text-xs text-slate-400">Kirimkan tiket kendala kamu dan pantau balasan langsung dari Tim Admin</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Form Buat Laporan -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
          <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
            <i data-lucide="send" class="w-4 h-4 text-indigo-400"></i> Buat Tiket Baru
          </h3>

          <form onsubmit="submitReport(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Kategori Kendala</label>
              <select id="categorySelect" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500 text-slate-200">
                <option value="Kendala BOT WA Tidak berjalan">Kendala BOT WA Tidak berjalan</option>
                <option value="Tidak terkoneksi ke WA">Tidak terkoneksi ke WA</option>
                <option value="Pembayaran Langganan">Pembayaran Langganan</option>
                <option value="Auto-Generate Prompt Error">Auto-Generate Prompt Error</option>
                <option value="Kuota Bulanan Bermasalah">Kuota Bulanan Bermasalah</option>
                <option value="Respon AI Lambat">Respon AI Lambat</option>
                <option value="Spam Balasan / Duplicate Chat">Spam Balasan / Duplicate Chat</option>
                <option value="Masalah Akun & Akses Login">Masalah Akun & Akses Login</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Subjek Laporan</label>
              <input type="text" id="subjectInput" required placeholder="Judul ringkas masalah..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-300 mb-1">Detail Deskripsi Kendala</label>
              <textarea id="messageInput" rows="5" required placeholder="Jelaskan kendala secara lengkap..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs focus:outline-none focus:border-indigo-500 leading-relaxed"></textarea>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
              <i data-lucide="send" class="w-4 h-4"></i> Kirim Laporan Kendala
            </button>
          </form>
        </div>

        <!-- List Laporan Saya -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
          <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
            <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i> Riwayat Laporan Saya
          </h3>

          <div id="reportsContainer" class="space-y-3">
            <p class="text-xs text-slate-500 italic">Memuat riwayat laporan...</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login.html';

    async function loadReports() {
      try {
        const res = await fetch('/api/reports/my-reports', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const result = await res.json();
        
        const container = document.getElementById('reportsContainer');
        container.innerHTML = '';

        if (!result.data || result.data.length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-500 italic p-4 bg-slate-950 rounded-xl border border-slate-800">Belum ada laporan kendala yang pernah dikirim.</p>';
          return;
        }

        result.data.forEach(rpt => {
          const statusBadgeClass = 
            rpt.status === 'Resolved' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
            rpt.status === 'In Progress' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
            'bg-slate-800 text-slate-400 border-slate-700';

          const card = document.createElement('div');
          card.className = 'bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3';
          card.innerHTML = `
            <div class="flex justify-between items-start gap-2">
              <div>
                <span class="font-mono text-[10px] bg-slate-800 px-2 py-0.5 rounded text-indigo-300 font-bold">${rpt.reportId}</span>
                <h4 class="font-bold text-xs text-slate-200 mt-1">${rpt.subject}</h4>
                <p class="text-[10px] text-slate-400">Kategori: <span class="text-slate-300 font-medium">${rpt.category}</span> • ${new Date(rpt.createdAt).toLocaleString('id-ID')}</p>
              </div>
              <span class="text-[10px] px-2.5 py-1 rounded-full border font-bold ${statusBadgeClass}">${rpt.status}</span>
            </div>

            <p class="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-lg border border-slate-800/80 leading-relaxed">${rpt.message}</p>

            ${rpt.adminReply ? `
              <div class="bg-indigo-950/40 border border-indigo-500/30 p-3 rounded-lg space-y-1">
                <p class="text-[10px] font-bold text-indigo-400 flex items-center gap-1">
                  <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Balasan Admin (${new Date(rpt.repliedAt).toLocaleString('id-ID')}):
                </p>
                <p class="text-xs text-indigo-200 leading-relaxed">${rpt.adminReply}</p>
              </div>
            ` : '<p class="text-[10px] text-slate-500 italic">⏳ Menunggu konfirmasi balasan Admin...</p>'}
          `;
          container.appendChild(card);
        });

        if (typeof lucide !== 'undefined') lucide.createIcons();
      } catch (err) {
        console.error(err);
      }
    }

    async function submitReport(e) {
      e.preventDefault();
      const category = document.getElementById('categorySelect').value;
      const subject = document.getElementById('subjectInput').value;
      const message = document.getElementById('messageInput').value;

      try {
        const res = await fetch('/api/reports', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ category, subject, message })
        });

        const data = await res.json();
        alert(data.message);

        if (data.success) {
          document.getElementById('subjectInput').value = '';
          document.getElementById('messageInput').value = '';
          loadReports();
        }
      } catch {
        alert("Gagal mengirimkan laporan.");
      }
    }

    loadReports();
  </script>
</body>
</html>
