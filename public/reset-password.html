<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - WA AutoBot AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-4">
    <h1 class="text-xl font-bold text-indigo-400">Buat Password Baru</h1>
    <form onsubmit="handleReset(event)" class="space-y-4">
      <input type="password" id="newPassword" placeholder="Password Baru" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm">
      <input type="password" id="confirmPassword" placeholder="Verifikasi Password Baru" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm">
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl transition">Simpan Password Baru</button>
    </form>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function handleReset(e) {
      e.preventDefault();
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          newPassword: document.getElementById('newPassword').value,
          confirmPassword: document.getElementById('confirmPassword').value
        })
      });
      const data = await res.json();
      alert(data.message);
      if (data.success) window.location.href = '/';
    }
  </script>
</body>
</html>
