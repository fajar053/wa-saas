<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lupa Password - WA AutoBot AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-4">
    <h1 class="text-xl font-bold text-indigo-400">Lupa Password</h1>
    <p class="text-xs text-slate-400">Masukkan email kamu. Kami akan mengirimkan link untuk me-reset password.</p>
    <form onsubmit="handleForgot(event)" class="space-y-4">
      <input type="email" id="email" required placeholder="Email terdaftar" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm">
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl transition">Kirim Link Reset</button>
    </form>
  </div>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value })
      });
      const data = await res.json();
      alert(data.message);
    }
  </script>
</body>
</html>
