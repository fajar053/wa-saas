<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - WA Bot SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Login Dashboard</h2>
    <input id="email" type="email" placeholder="Email" class="w-full p-2 border rounded mb-4">
    <input id="password" type="password" placeholder="Password" class="w-full p-2 border rounded mb-4">
    <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Login</button>
    <p class="mt-4 text-sm text-center">Belum punya akun? <a href="#" onclick="register()" class="text-blue-600">Daftar</a></p>
  </div>

  <script>
    async function login() {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: password.value })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard.html';
      } else alert(data.message);
    }

    async function register() {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, password: password.value })
      });
      const data = await res.json();
      alert(data.message || 'Register berhasil, silakan login!');
    }
  </script>
</body>
</html>
