<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - WA AutoBot AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-8 max-w-md w-full shadow-2xl space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-indigo-400">WA AutoBot AI</h1>
      <p class="text-xs text-slate-400 mt-1">Masuk ke akun kamu untuk mengelola bot</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-medium text-slate-400">Password</label>
          <a href="/forgot-password.html" class="text-xs text-indigo-400 hover:underline">Lupa Password?</a>
        </div>
        <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl transition">Masuk</button>
    </form>

    <p class="text-xs text-center text-slate-400">
      Belum punya akun? <a href="/register.html" class="text-indigo-400 font-semibold hover:underline">Daftar Sekarang</a>
    </p>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('token', data.token);
        window.location.href = '/dashboard.html';
      } else {
        alert(data.message);
      }
    }
  </script>
</body>
</html>
