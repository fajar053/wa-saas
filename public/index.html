<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - WA Bot SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Login Dashboard</h2>
    <input id="email" type="email" placeholder="Email" class="w-full p-2 border rounded mb-4" required>
    <input id="password" type="password" placeholder="Password" class="w-full p-2 border rounded mb-4" required>
    <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 font-semibold">Login</button>
    <p class="mt-4 text-sm text-center">Belum punya akun? <a href="#" onclick="register()" class="text-blue-600 font-semibold underline">Daftar</a></p>
  </div>

  <script>
    async function login() {
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      if (!emailInput || !passwordInput) {
        alert('Isi email dan password terlebih dahulu!');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput, password: passwordInput })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          window.location.href = '/dashboard.html';
        } else {
          alert(data.message || data.error || 'Login gagal, periksa email dan password!');
        }
      } catch (err) {
        alert('Gagal terhubung ke server!');
      }
    }

    async function register() {
      const emailInput = document.getElementById('email').value.trim();
      const passwordInput = document.getElementById('password').value.trim();

      if (!emailInput || !passwordInput) {
        alert('Isi email dan password untuk mendaftar!');
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailInput, password: passwordInput })
        });
        const data = await res.json();

        if (data.success) {
          alert(data.message || 'Register berhasil! Silakan login.');
        } else {
          alert(data.message || data.error || 'Register gagal!');
        }
      } catch (err) {
        alert('Gagal terhubung ke server!');
      }
    }
  </script>
</body>
</html>
